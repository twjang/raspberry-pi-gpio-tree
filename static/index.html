<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light Tree Control</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      place-items: center;
      background:
        radial-gradient(circle at top, rgb(255 190 70 / 18%), transparent 42%),
        #0d1117;
    }

    main {
      width: min(100%, 32rem);
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid #30363d;
      border-radius: 1.25rem;
      background: rgb(22 27 34 / 92%);
      box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 35%);
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: clamp(1.6rem, 7vw, 2.4rem);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0 0 2.5rem;
      color: #8b949e;
    }

    .status::before {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: #d29922;
      content: "";
    }

    .status.connected::before {
      background: #3fb950;
      box-shadow: 0 0 0.75rem #3fb950;
    }

    .status.error::before {
      background: #f85149;
    }

    .value-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    label {
      font-weight: 650;
    }

    output {
      color: #ffc857;
      font-size: 2rem;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
    }

    input[type="range"] {
      width: 100%;
      height: 2.5rem;
      accent-color: #ffc857;
      cursor: pointer;
    }

    input[type="range"]:disabled {
      cursor: wait;
      opacity: 0.45;
    }

    .scale {
      display: flex;
      justify-content: space-between;
      color: #8b949e;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Light Tree</h1>
    <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>

    <div class="value-row">
      <label for="brightness">Brightness</label>
      <output id="value" for="brightness">0 / 1000</output>
    </div>
    <input id="brightness" type="range" min="0" max="1000" value="0" step="1" disabled>
    <div class="scale" aria-hidden="true"><span>Off</span><span>1000</span></div>
  </main>

  <script>
    const slider = document.querySelector("#brightness");
    const value = document.querySelector("#value");
    const status = document.querySelector("#status");
    let socket;
    let reconnectTimer;
    let pendingBrightness;
    let sendScheduled = false;
    const maxBrightness = 1000;

    function showBrightness(brightness) {
      const normalized = Math.max(0, Math.min(maxBrightness, Number(brightness)));
      slider.value = normalized;
      value.value = `${normalized} / ${maxBrightness}`;
    }

    function setStatus(message, state = "") {
      status.textContent = message;
      status.className = `status ${state}`.trim();
    }

    function sendBrightness() {
      sendScheduled = false;
      if (pendingBrightness === undefined || socket?.readyState !== WebSocket.OPEN) {
        return;
      }

      socket.send(`set ${pendingBrightness}`);
      pendingBrightness = undefined;
    }

    slider.addEventListener("input", () => {
      showBrightness(slider.value);
      pendingBrightness = slider.value;

      if (!sendScheduled) {
        sendScheduled = true;
        window.requestAnimationFrame(sendBrightness);
      }
    });

    function connect() {
      window.clearTimeout(reconnectTimer);
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const currentSocket = new WebSocket(`${protocol}//${window.location.host}/ws`);
      socket = currentSocket;
      setStatus("Connecting…");
      slider.disabled = true;

      currentSocket.addEventListener("open", () => {
        setStatus("Connected", "connected");
        slider.disabled = false;
        currentSocket.send("get");
      });

      currentSocket.addEventListener("message", (event) => {
        const response = String(event.data).trim();
        const match = response.match(/^get=(\d+)$/);
        if (match) {
          showBrightness(match[1]);
        } else if (response.startsWith("set=")) {
          setStatus("Connected", "connected");
        } else if (response.startsWith("err=")) {
          setStatus(response.slice(4), "error");
        }
      });

      currentSocket.addEventListener("close", () => {
        if (socket !== currentSocket) {
          return;
        }
        setStatus("Disconnected — retrying…", "error");
        slider.disabled = true;
        reconnectTimer = window.setTimeout(connect, 1500);
      });

      currentSocket.addEventListener("error", () => currentSocket.close());
    }

    connect();
  </script>
</body>
</html>
